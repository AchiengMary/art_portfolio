<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work · Achieng.M</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body data-page="portfolio">
<main><p><a href="portfolio.html">← Back to portfolio</a></p><div id="out"></div></main>
<script src="data.js"></script><script src="site.js"></script>
<script>
const w=WORKS.find(x=>x.id===new URLSearchParams(location.search).get('id'))||WORKS[0];
const c=COLLECTIONS.find(x=>x.id===w.collection);document.title=w.title+' · Achieng.M';
document.getElementById('out').innerHTML=`<div class="work"><div><div class="main"><img id="big" src="${w.images[0]}" alt="${w.title}"></div>
<div class="thumbs">${w.images.map((s,i)=>`<img src="${s}" class="${i?'':'on'}" alt="View ${i+1}">`).join('')}</div></div>
<div><h1 style="margin:0;font-size:2.4rem">${w.title}</h1><p class="meta">${c?c.title+'<br>':''}${w.medium} · ${w.size} · ${w.year}</p>
<p>${w.description||''}</p><h2 style="font-size:1.6rem;margin-top:36px">Inquire about this painting</h2>
<form action="${SITE.formspree}" method="POST"><input type="hidden" name="painting" value="${w.title} (${w.year})">
<input type="hidden" name="_subject" value="Inquiry: ${w.title}">
<label>Your email</label><input type="email" name="email" required placeholder="you@example.com">
<label>Message</label><textarea name="message" required>I'd like to know more about "${w.title}".</textarea>
<button type="submit">Send inquiry</button></form></div></div>`;
document.querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{big.src=t.src;document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('on'));t.classList.add('on')});
</script></body></html>
